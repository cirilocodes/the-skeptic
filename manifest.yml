modules:
  rovo:agent:
    - key: skeptic-agent
      name: The Skeptic
      description: Argues against a plan using your organisation's own history, citing every objection, and checks answers before a plan can start. Also answers "has anyone here tried this?"
      prompt: resource:prompts;skeptic.md
      conversationStarters:
        - Review this plan
        - Review this page as a proposal
        - Has anyone here tried this before?
        - Here is my answer to objection 1
        - Can this plan start?
      actions:
        - find-evidence
        - save-review
        - get-review
        - check-precedent
        - respond-to-objection
        - gate-status

  action:
    - key: find-evidence
      name: Find evidence about a plan
      function: findEvidence
      actionVerb: GET
      description: Returns the plan split into sections, ranked evidence from past plans, incidents, risks and Confluence pages the user can see, and rule findings. Call before writing a review.
      inputs:
        planKey:
          title: Work item key
          type: string
          required: false
          description: The Jira key of the plan, e.g. KF-42. Leave empty for a Confluence page or to use the current work item.
        pageId:
          title: Confluence page ID
          type: string
          required: false
          description: The numeric ID of a Confluence page to review as a proposal. Leave empty for Jira plans. Digits only; never put a Jira key here (use planKey).
        searchTerms:
          title: Search terms
          type: string
          required: false
          description: Comma-separated keywords and synonyms for the plan's core idea, e.g. "live chat, messaging, chat support".

    - key: save-review
      name: Save the Skeptic review
      function: saveReview
      actionVerb: CREATE
      description: Saves the review after find-evidence. Pass up to three independent passes in runsJson; code verifies citations, votes across passes and computes severity.
      inputs:
        planKey:
          title: Work item key
          type: string
          required: false
          description: The Jira key of the plan. Leave empty for a Confluence page or to use the current work item.
        pageId:
          title: Confluence page ID
          type: string
          required: false
          description: The numeric ID of the Confluence page, when reviewing a page. Digits only; never put a Jira key here (use planKey).
        runsJson:
          title: Review passes as JSON
          type: string
          required: true
          description: 'JSON array of one to three passes: {summary, assumptions:[{id,text,section}], objections:[{assumption,ref,claim,strength,impact,likelihood,reversibility,mitigation,planAlreadyHandles,talkTo,satisfiedBy}], questions, revisitWhen}.'

    - key: get-review
      name: Get the current Skeptic review
      function: getReviewAction
      actionVerb: GET
      description: Returns the saved review for a plan, with numbered objections, their severity and status, what the plan already covers and what was checked.
      inputs:
        planKey:
          title: Work item key
          type: string
          required: false
          description: The Jira key of the plan. Leave empty for a Confluence page or to use the current work item.
        pageId:
          title: Confluence page ID
          type: string
          required: false
          description: The numeric ID of the Confluence page. Digits only; never put a Jira key here (use planKey).

    - key: check-precedent
      name: Check for precedent
      function: checkPrecedent
      actionVerb: GET
      description: Answers "has anyone here tried this before?" for any idea, no plan needed. Returns a precedent level, reasons, and links to related plans, incidents, pages and risks.
      inputs:
        idea:
          title: Idea
          type: string
          required: true
          description: The idea in a sentence, e.g. "add live chat to the mobile app".
        searchTerms:
          title: Search terms
          type: string
          required: false
          description: Optional comma-separated keywords and synonyms for the idea.

    - key: respond-to-objection
      name: Respond to an objection
      function: respondToObjection
      actionVerb: UPDATE
      description: Records the author's answer to one objection after you grade it. Code checks the answer too and may return a rebuttal to relay. High-severity risk acceptance is finished in the panel.
      inputs:
        planKey:
          title: Work item key
          type: string
          required: false
          description: The Jira key of the plan. Leave empty for a Confluence page or to use the current work item.
        pageId:
          title: Confluence page ID
          type: string
          required: false
          description: The numeric ID of the Confluence page. Digits only; never put a Jira key here (use planKey).
        objection:
          title: Objection number
          type: string
          required: true
          description: The objection's number from get-review, e.g. "1".
        responseType:
          title: Response type
          type: string
          required: true
          description: One of evidence, plan-change, covered, not-relevant, accept-risk.
        answer:
          title: Answer
          type: string
          required: false
          description: The author's answer in their own words.
        link:
          title: Evidence link
          type: string
          required: false
          description: For evidence, a Jira key or Confluence page link that answers the objection.
        quote:
          title: Plan quote
          type: string
          required: false
          description: For covered, the exact sentence from the plan that already handles the objection.
        grade:
          title: Your grade
          type: string
          required: false
          description: pass or fail, after checking the answer is specific and about the objection.
        rebuttal:
          title: Your rebuttal
          type: string
          required: false
          description: If you graded fail, one or two sentences saying what is missing.

    - key: gate-status
      name: Can this plan start?
      function: gateStatus
      actionVerb: GET
      description: Says whether a plan may move out of To Do under the Skeptic gate, and if not, which objections block it. Use before starting work on a plan, including from a coding agent.
      inputs:
        planKey:
          title: Work item key
          type: string
          required: false
          description: The Jira key of the plan, e.g. KF-42. Leave empty to use the current work item.

  rovo:mcp:
    - key: skeptic-mcp
      name: The Skeptic
      tools:
        - check-precedent
        - find-evidence
        - get-review
        - gate-status
        - respond-to-objection

  jira:issuePanel:
    - key: skeptic-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: The Skeptic
      icon: resource:icons;skeptic.svg

  jira:issueContext:
    - key: skeptic-context
      resource: context
      resolver:
        function: resolver
      render: native
      title: The Skeptic
      label: Skeptic status
      icon: resource:icons;skeptic.svg

  confluence:contentBylineItem:
    - key: skeptic-byline
      resource: page
      resolver:
        function: resolver
      render: native
      title: The Skeptic
      tooltip: Check this proposal against what your organisation has already tried
      icon: resource:icons;skeptic.svg
      dynamicProperties:
        function: bylineProps

  jira:globalPage:
    - key: skeptic-dashboard
      resource: dashboard
      resolver:
        function: resolver
      render: native
      title: The Skeptic
      icon: resource:icons;skeptic.svg

  jira:adminPage:
    - key: skeptic-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: The Skeptic settings
      useAsConfig: true

  jira:workflowValidator:
    - key: skeptic-gate
      name: Skeptic objections resolved
      description: Blocks moving a plan out of To Do while Skeptic objections at or above the gate severity are unresolved or awaiting sign-off, or while its radar requires a review.
      function: gate
      projectTypes:
        - company-managed
        - team-managed

  jira:entityProperty:
    - key: skeptic-ledger-index
      entityType: issue
      propertyKey: skeptic-ledger
      values:
        - path: openCount
          type: number
          searchAlias: skepticOpen
        - path: blocking
          type: number
          searchAlias: skepticBlocking
        - path: verdict
          type: string
          searchAlias: skepticVerdict
        - path: state
          type: string
          searchAlias: skepticState
        - path: topSeverity
          type: string
          searchAlias: skepticSeverity

  trigger:
    - key: skeptic-on-issue-created
      function: onIssueCreated
      events:
        - avi:jira:created:issue
    - key: skeptic-on-issue-updated
      function: onIssueUpdated
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
    - key: skeptic-on-issue-deleted
      function: onIssueDeleted
      events:
        - avi:jira:deleted:issue
    - key: skeptic-on-page
      function: onPageEvent
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
    - key: skeptic-on-installed
      function: onInstalled
      events:
        - avi:forge:installed:app

  scheduledTrigger:
    - key: skeptic-daily-sweep
      function: dailySweep
      interval: day

  webtrigger:
    - key: skeptic-intake
      function: intake
      response:
        type: dynamic

  consumer:
    - key: skeptic-jobs-consumer
      queue: skeptic-jobs
      function: jobs

  function:
    - key: findEvidence
      handler: index.findEvidence
    - key: saveReview
      handler: index.saveReview
    - key: getReviewAction
      handler: index.getReviewAction
    - key: checkPrecedent
      handler: index.checkPrecedent
    - key: respondToObjection
      handler: index.respondToObjection
    - key: gateStatus
      handler: index.gateStatus
    - key: resolver
      handler: index.handler
    - key: gate
      handler: index.gate
    - key: onIssueCreated
      handler: index.onIssueCreated
    - key: onIssueUpdated
      handler: index.onIssueUpdated
    - key: onIssueDeleted
      handler: index.onIssueDeleted
    - key: onPageEvent
      handler: index.onPageEvent
    - key: onInstalled
      handler: index.onInstalled
    - key: bylineProps
      handler: index.bylineProps
    - key: dailySweep
      handler: index.dailySweep
      timeoutSeconds: 300
    - key: intake
      handler: index.intake
    - key: jobs
      handler: index.jobs
      timeoutSeconds: 300

resources:
  - key: panel
    path: src/frontend/index.jsx
  - key: page
    path: src/frontend/page.jsx
  - key: context
    path: src/frontend/context.jsx
  - key: dashboard
    path: src/frontend/dashboard.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: prompts
    path: src/prompts
  - key: icons
    path: static/icons

app:
  runtime:
    name: nodejs22.x
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  id: ari:cloud:ecosystem::app/e20c9eb8-7d78-45ec-a500-9295580ccc32

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - read:chat:rovo
    - read:confluence-content.summary
    - read:confluence-content.permission
    - search:confluence
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - write:comment:confluence
